<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sky Swing">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#123a6b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Sky Swing</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#0d2140;overflow:hidden;
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
 touch-action:none;overscroll-behavior:none;}
#c{display:block;position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* ============================================================
   SKY SWING  —  rooftop rescue swinging game
   Single-file HTML5 canvas. Logical stage 960x540.
   ============================================================ */

var LW = 960, LH = 540;
var cv = document.getElementById("c"), ctx = cv.getContext("2d");
var scale = 1, offX = 0, offY = 0, DPR = 1;

function fit() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.6);
  var w = window.innerWidth, h = window.innerHeight;
  cv.width = Math.floor(w * DPR); cv.height = Math.floor(h * DPR);
  scale = Math.min(w / LW, h / LH);
  offX = (w - LW * scale) / 2; offY = (h - LH * scale) / 2;
}
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", function () { setTimeout(fit, 250); });

/* ---------- helpers ---------- */
var TAU = Math.PI * 2;
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function hyp(x, y) { return Math.sqrt(x * x + y * y); }
function rnd(a, b) { return a + Math.random() * (b - a); }
function seeded(s) { var x = s >>> 0; return function () { x = (1664525 * x + 1013904223) >>> 0; return x / 4294967296; }; }
function rr(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.closePath(); }
function starPath(x, y, R, pts, inner, rot) {
  pts = pts || 5; inner = inner || 0.45; rot = rot || 0;
  ctx.beginPath();
  for (var i = 0; i < pts * 2; i++) {
    var rad = i % 2 === 0 ? R : R * inner, a = rot + i * Math.PI / pts - Math.PI / 2;
    var px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath();
}

/* ---------- save ---------- */
var SAVE = { bestDist: 0, bestSaved: 0, level: 1, times: {}, sfx: 1, mus: 1, seen: 0 };
try {
  var raw = localStorage.getItem("skySwing_v2");
  if (raw) { var o = JSON.parse(raw); for (var k in o) SAVE[k] = o[k]; }
} catch (e) { }
function save() { try { localStorage.setItem("skySwing_v2", JSON.stringify(SAVE)); } catch (e) { } }

/* ---------- audio ---------- */
var AC = null, master = null, musGain = null, musTimer = 0, musStep = 0;
function audioInit() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    musGain = AC.createGain(); musGain.gain.value = 0.0; musGain.connect(master);
  } catch (e) { AC = null; }
}
function blip(freq, dur, type, vol, slide) {
  if (!AC || !SAVE.sfx) return;
  var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.25, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, hp) {
  if (!AC || !SAVE.sfx) return;
  var n = Math.floor(AC.sampleRate * dur), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  var s = AC.createBufferSource(); s.buffer = b;
  var f = AC.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp || 900;
  var g = AC.createGain(); g.gain.value = vol || 0.15;
  s.connect(f); f.connect(g); g.connect(master); s.start();
}
var SFX = {
  thwip: function () { blip(880, 0.10, "square", 0.12, 240); noise(0.07, 0.10, 1600); },
  release: function () { blip(300, 0.08, "sine", 0.08, 520); },
  star: function () { blip(1180, 0.10, "triangle", 0.16); blip(1560, 0.14, "triangle", 0.11); },
  pick: function () { blip(520, 0.10, "sine", 0.18, 900); blip(780, 0.16, "sine", 0.12); },
  saved: function () { [660, 880, 1100].forEach(function (f, i) { setTimeout(function () { blip(f, 0.18, "triangle", 0.18); }, i * 90); }); },
  swoosh: function () { noise(0.22, 0.05, 420); },
  land: function () { noise(0.09, 0.10, 500); blip(150, 0.08, "sine", 0.10, 90); },
  bump: function () { blip(120, 0.10, "square", 0.08, 70); },
  bubble: function () { blip(420, 0.30, "sine", 0.10, 900); },
  win: function () { [523, 659, 784, 1046, 1318].forEach(function (f, i) { setTimeout(function () { blip(f, 0.26, "triangle", 0.20); }, i * 110); }); },
  tap: function () { blip(700, 0.06, "square", 0.10); }
};
var MUS = [0, 3, 7, 10, 12, 10, 7, 3];
function musicTick(dt) {
  if (!AC) return;
  musGain.gain.value = SAVE.mus ? 0.16 : 0;
  if (!SAVE.mus) return;
  musTimer -= dt;
  if (musTimer <= 0) {
    musTimer = 0.42;
    var base = 220 * Math.pow(2, MUS[musStep % MUS.length] / 12);
    var t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
    o.type = "sine"; o.frequency.value = base * (musStep % 8 < 4 ? 1 : 1.5);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.5, t + 0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.75);
    o.connect(g); g.connect(musGain); o.start(t); o.stop(t + 0.8);
    musStep++;
  }
}

/* ============================================================
   CITY  —  endless chunked generator, palettes that drift
   ============================================================ */
var GROUND = 1500;
var PALS = [
  { k: "day",    sky: ["#7fc7f5", "#cfeaff"], far: "#a9cfe6", mid: "#8fb9d6", bld: "#7ea7c4", bldD: "#6d94b0", roof: "#5f849f", win: "#eaf6ff", fog: "#c9dfee", sun: "#fff6c9", night: 0 },
  { k: "dawn",   sky: ["#f6a97f", "#ffe6c2"], far: "#e0b39a", mid: "#c9997f", bld: "#b78770", bldD: "#a0755f", roof: "#8e6754", win: "#fff0d0", fog: "#f0cdb0", sun: "#fff1b8", night: 0 },
  { k: "sunset", sky: ["#ff8f6b", "#ffd39b"], far: "#c98d8a", mid: "#a97078", bld: "#8f5f6d", bldD: "#7a5060", roof: "#684456", win: "#ffe08a", fog: "#e8a68f", sun: "#ffd76a", night: 0 },
  { k: "night",  sky: ["#101d3a", "#2b3f6b"], far: "#22315a", mid: "#2c3f6d", bld: "#33487a", bldD: "#2a3c66", roof: "#22325a", win: "#ffe9a3", fog: "#2b3f6b", sun: "#eef4ff", night: 1 },
  { k: "storm",  sky: ["#4a5a6e", "#8fa2b4"], far: "#7b8c9c", mid: "#657688", bld: "#57687a", bldD: "#4a5a6b", roof: "#3f4e5e", win: "#dfe9f2", fog: "#8fa2b4", sun: "#c8d6e2", night: 0 },
  { k: "snow",   sky: ["#9fb6cc", "#e8f2fa"], far: "#c2d4e2", mid: "#a8bccb", bld: "#94a9bb", bldD: "#8296a8", roof: "#f2f8fc", win: "#fff8dc", fog: "#dceaf4", sun: "#ffffff", night: 0 }
];
function hex2(h) { var n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mixHex(a, b, t) {
  var A = hex2(a), B = hex2(b);
  var r = Math.round(A[0] + (B[0] - A[0]) * t), g = Math.round(A[1] + (B[1] - A[1]) * t), bl = Math.round(A[2] + (B[2] - A[2]) * t);
  return "rgb(" + r + "," + g + "," + bl + ")";
}
var PKEYS = ["far", "mid", "bld", "bldD", "roof", "win", "fog", "sun"];
function mixPal(a, b, t) {
  var o = { sky: [mixHex(a.sky[0], b.sky[0], t), mixHex(a.sky[1], b.sky[1], t)], night: t > 0.5 ? b.night : a.night, nightMix: a.night * (1 - t) + b.night * t };
  for (var i = 0; i < PKEYS.length; i++) o[PKEYS[i]] = mixHex(a[PKEYS[i]], b[PKEYS[i]], t);
  return o;
}
var ZONE = 6000;
function paletteAt(x) {
  var z = Math.floor(x / ZONE), f = x / ZONE - z;
  var a = PALS[((z % PALS.length) + PALS.length) % PALS.length];
  var b = PALS[((z + 1) % PALS.length + PALS.length) % PALS.length];
  var t = clamp((f - 0.75) / 0.25, 0, 1);
  return t <= 0 ? mixPal(a, a, 0) : mixPal(a, b, t);
}

/* ---------- modes ---------- */
var MODES = {
  endless: { gap: [70, 165], hi: [380, 800], vic: 0, end: 0 },
  flag:    { gap: [70, 150], hi: [300, 620], vic: 0, end: 7200 },
  rescue:  { gap: [70, 165], hi: [380, 780], vic: 1, end: 0 }
};

var L = null;
function corridorY(x) { return GROUND - 430 + Math.sin(x * 0.00215) * 150 + Math.sin(x * 0.00071) * 70; }

var MAXLVL = 8, forceLv = 0;
function newCity(mode) {
  var cfg = MODES[mode];
  if (mode === "flag") {
    var lv = clamp(forceLv || SAVE.level || 1, 1, MAXLVL); forceLv = 0;
    cfg = { gap: [70, 140 + lv * 12], hi: [360, 700 + lv * 30], vic: 0, end: 4500 + (lv - 1) * 600, lv: lv };
  }
  L = {
    mode: mode, cfg: cfg, rng: seeded(Math.floor(Math.random() * 1e9) >>> 0),
    B: [], stars: [], vic: [], nextX: 120, drop: 0, starX: 420,
    P: paletteAt(0), startX: 0, dist: 0, starGot: 0, saved: 0, time: 0,
    end: null, done: 0,
    far: [], mid: [], clouds: [], fore: [], nextFar: -400, nextMid: -400, nextCloud: -300, nextFore: 600
  };
  /* launch platform */
  L.B.push({ x: 120, w: 240, top: GROUND - 380, start: 1 });
  L.nextX = 120 + 240 + 110;
  L.startX = 300;
  for (var i = 0; i < 5; i++) addChunk();
  extendBack(1200);
  return L;
}

function addChunk() {
  var R = L.rng, c = L.cfg, x = L.nextX, i;
  for (i = 0; i < 8; i++) {
    if (c.end && x > c.end) {
      if (!L.end) {
        var f = { x: x + 60, w: 300, top: GROUND - 430, flag: 1 };
        L.B.push(f); L.end = f;
      }
      L.nextX = 1e9;          /* level is finished — never generate again */
      return;
    }
    var w = Math.round(112 + R() * 104);
    var h = Math.round(c.hi[0] + R() * (c.hi[1] - c.hi[0]));
    var b = { x: x, w: w, top: GROUND - h };
    L.B.push(b);
    /* people to rescue, on roomy roofs */
    if (c.vic && L.B.length > 4 && w > 130 && R() < 0.34) {
      L.vic.push({ x: b.x + b.w * 0.5, y: b.top - 20, state: 0, t: R() * 6 });
    }
    /* a ribbon of stars along the line he actually swings through */
    while (L.starX < b.x + b.w) {
      L.stars.push({ x: L.starX, y: corridorY(L.starX), got: 0, t: R() * 6 });
      L.starX += 118;
    }
    x += w + Math.round(c.gap[0] + R() * (c.gap[1] - c.gap[0]));
  }
  L.nextX = x;
}

function extendBack(hx) {
  var R = L.rng;
  var fTo = hx * 0.35 + LW + 400, mTo = hx * 0.6 + LW + 400, cTo = hx * 0.14 + LW + 600;
  var gTo = hx * 1.34 + LW + 500;
  while (L.nextFore < gTo) {
    var fw = 130 + R() * 150;
    L.fore.push({ x: L.nextFore, w: fw, h: 620 + R() * 900 });
    L.nextFore += fw + 620 + R() * 900;
  }
  while (L.nextFar < fTo) { var w = 50 + R() * 130; L.far.push({ x: L.nextFar, w: w, h: 160 + R() * 420 }); L.nextFar += w + 8 + R() * 60; }
  while (L.nextMid < mTo) { var w2 = 70 + R() * 140; L.mid.push({ x: L.nextMid, w: w2, h: 240 + R() * 600 }); L.nextMid += w2 + 10 + R() * 70; }
  while (L.nextCloud < cTo) { L.clouds.push({ x: L.nextCloud, y: GROUND - 700 - R() * 700, s: 0.6 + R() * 1.1 }); L.nextCloud += 160 + R() * 380; }
}

function cityUpdate(hx) {
  var guard = 0;
  while (L.nextX < hx + 2600 && guard++ < 40) addChunk();
  extendBack(hx);
  var cut = hx - 1500;
  while (L.B.length > 3 && L.B[0].x + L.B[0].w < cut && !L.B[0].flag) L.B.shift();
  while (L.stars.length && L.stars[0].x < cut) L.stars.shift();
  while (L.vic.length && L.vic[0].x < cut - 400) L.vic.shift();
  while (L.far.length && L.far[0].x < cut * 0.35 - 400) L.far.shift();
  while (L.mid.length && L.mid[0].x < cut * 0.6 - 400) L.mid.shift();
  while (L.clouds.length && L.clouds[0].x < cut * 0.14 - 400) L.clouds.shift();
  while (L.fore.length && L.fore[0].x < cut * 1.34 - 600) L.fore.shift();
  if (L.mode !== "flag") L.P = paletteAt(hx);
}

/* ============================================================
   HERO + PHYSICS
   He swings IN FRONT of the city. Buildings are scenery he webs
   onto — he never collides with them. Only the sky and the street
   below have any say in where he goes.
   ============================================================ */
var GRAV = 0.36, MAXR = 500, MINROPE = 200, REEL = 0.16, PUMP = 0.15, VMAX = 9.5, HR = 15;
var CRUISE = 6.8;        /* he settles at this speed instead of accelerating forever */
var LOWLINE = GROUND - 280;      /* get under this and the web pulls him back up */
var H = null, held = false;
var parts = [], toasts = [];

function resetHero() {
  H = {
    x: 300, y: GROUND - 560, vx: 5.0, vy: -1.5,
    rope: null, face: 1, t: 0, since: 0, cool: 0, stall: 0,
    bubble: 0, arm: 0, handX: undefined, handY: undefined
  };
}

/* Any rooftop point above him is fair game — the web line simply passes
   in front of the buildings, exactly like it does in the real thing. */
function findAnchor() {
  var best = null, bestS = -1e9;
  var lead = H.x + H.vx * 16;
  for (var i = 0; i < L.B.length; i++) {
    var b = L.B[i];
    if (b.x + b.w < H.x - 200 || b.x > H.x + MAXR + 60) continue;
    var cand = [b.x + 8, b.x + b.w * 0.35, b.x + b.w * 0.68, b.x + b.w - 8];
    for (var c = 0; c < cand.length; c++) {
      var ax = cand[c], ay = b.top - 6;
      if (ay > H.y - 60) continue;
      var dx = ax - H.x, dyUp = H.y - ay;
      var d = hyp(dx, dyUp);
      if (d > MAXR || d < 110) continue;
      if (dx < -60) continue;
      var ang = Math.atan2(dyUp, Math.abs(dx) < 1 ? 1 : dx);
      var sc = 3.0 - 2.2 * Math.abs(ang - 0.88);
      if (dx < 60) sc -= 1.5;
      sc += 1.4 * (1 - Math.abs(d - 330) / MAXR);
      sc += 0.9 * (1 - Math.abs(ax - lead) / MAXR);
      if (H.y > LOWLINE - 180) sc += 1.2 * clamp(dyUp / 400, 0, 1);   /* low down: reach high */
      if (sc > bestS) { bestS = sc; best = { ax: ax, ay: ay }; }
    }
  }
  return best;
}

function shootWeb() {
  var a = findAnchor();
  if (!a) return false;
  /* lock the swing direction once, at the moment he attaches — flipping it
     mid-swing was what made the whole thing shudder */
  var dx = H.x - a.ax, dy = H.y - a.ay, d = hyp(dx, dy) || 1;
  var tv = H.vx * (-dy / d) + H.vy * (dx / d);
  var dir = Math.abs(tv) > 0.8 ? (tv >= 0 ? 1 : -1) : -(H.face) * (dy >= 0 ? 1 : -1);
  H.rope = { ax: a.ax, ay: a.ay, len: d, dir: dir, age: 0 };
  H.since = 0; H.arm = 1;
  SFX.thwip();
  return true;
}
function letGo(quiet) {
  if (H.rope) { H.rope = null; H.since = 0; H.cool = 14; if (!quiet) SFX.release(); }
}
function pressStart() { held = true; }
function pressEnd() { held = false; }

function burst(x, y, n, cols) {
  for (var i = 0; i < n; i++) parts.push({
    x: x, y: y, vx: rnd(-4.5, 4.5), vy: rnd(-6.5, 1.5), life: rnd(30, 70), t: 0,
    c: cols[Math.floor(Math.random() * cols.length)], s: rnd(2.5, 6), sp: Math.random() < 0.4
  });
}
function toast(kind, n) { toasts.push({ kind: kind, n: n || 0, t: 0 }); }

function finishFlag() {
  if (L.done) return;
  L.done = 1; state = "won"; wonT = 0; SFX.win();
  var tm = Math.round(L.time), lv = L.cfg.lv || 1;
  if (!SAVE.times[lv] || SAVE.times[lv] > tm) { SAVE.times[lv] = tm; L.newBest = 1; }
  L.lv = lv;
  if (SAVE.level < MAXLVL && lv >= SAVE.level) SAVE.level = lv + 1;
  save();
  for (var k = 0; k < 70; k++) burst(H.x + rnd(-140, 140), H.y - rnd(0, 170), 1, ["#ffd84d", "#ff7ba8", "#7ef7a5", "#8fd8ff", "#ffffff"]);
}

/* ---------- the auto-swing brain ---------- */
function autoSwing() {
  if (!held) { if (H.rope) letGo(); return; }
  if (H.cool > 0) { H.cool--; return; }
  if (!H.rope) {
    /* wait for the top of the glide before throwing the next web, so there is a
       clear arc between swings instead of a stutter of them */
    var low = H.y > LOWLINE - 140;
    if (H.vy > -0.25 || low || H.since > 90) { if (!shootWeb()) H.since = 0; }
    return;
  }
  H.rope.age++;
  var sp = hyp(H.vx, H.vy);
  if (sp < 1.0) H.stall++; else H.stall = 0;
  if (H.stall > 60) { letGo(1); H.vx = Math.max(H.vx, 0) + 3.4; H.vy = -3.6; H.stall = 0; H.cool = 14; SFX.swoosh(); return; }
  /* one long swing: ride it well past the anchor before letting go */
  if (H.rope.age < 45) return;
  var dx = H.x - H.rope.ax;
  if (H.y > LOWLINE - 170 && H.vy < -0.5) return;          /* low: keep riding, it lifts him */
  if (dx > H.rope.len * 0.50 && H.vy < -0.3) letGo();
  else if (dx > H.rope.len * 0.90) letGo();
  else if (H.rope.age > 260) letGo();
}

/* ---------- physics ---------- */
function stepPlay() {
  L.time += 1 / 60;
  H.t++; H.since++;
  if (H.arm > 0) H.arm = Math.max(0, H.arm - 0.06);

  autoSwing();

  if (H.rope) {
    var dx = H.x - H.rope.ax, dy = H.y - H.rope.ay, d = hyp(dx, dy) || 1;
    var nx = dx / d, ny = dy / d;
    var taut = d > H.rope.len - 7;                 /* hysteresis: no frame-to-frame flapping */
    if (taut) {
      var tx = -ny, ty = nx, sp0 = hyp(H.vx, H.vy);
      var dir = H.rope.dir;
      if (sp0 < CRUISE) {                         /* only ever top him up to a walking-pace cruise */
        var boost = clamp((CRUISE - sp0) / CRUISE, 0, 1);
        H.vx += tx * dir * PUMP * boost; H.vy += ty * dir * PUMP * boost;
      }
      if (H.rope.len > MINROPE && ny > 0.2) H.rope.len -= REEL;
    } else if (H.rope.len > MINROPE + 40) {
      H.rope.len -= REEL * 1.6;
      if (H.rope.len < d) H.rope.len = d;
    }
    H.vy += GRAV;
    H.vx *= 0.9992; H.vy *= 0.9992;
    H.x += H.vx; H.y += H.vy;
    dx = H.x - H.rope.ax; dy = H.y - H.rope.ay; d = hyp(dx, dy) || 1;
    if (d > H.rope.len) {
      nx = dx / d; ny = dy / d;
      H.x = H.rope.ax + nx * H.rope.len; H.y = H.rope.ay + ny * H.rope.len;
      var rad = H.vx * nx + H.vy * ny;
      H.vx -= nx * rad; H.vy -= ny * rad;
    }
  } else {
    H.vy += GRAV;
    H.vx *= 0.9995;
    H.x += H.vx; H.y += H.vy;
  }

  /* the street is a cushion, never a wall */
  if (H.y > LOWLINE) {
    var over = (H.y - LOWLINE) / 200;
    H.vy -= (0.34 + over * 0.9);
    if (H.y > GROUND - 210) { H.y = GROUND - 210; if (H.vy > 0) H.vy = -Math.abs(H.vy) * 0.5 - 1.6; }
  }

  if (held && H.vx < 3.4) H.vx += 0.032;
  var sp2 = hyp(H.vx, H.vy);
  if (sp2 > VMAX) { H.vx *= VMAX / sp2; H.vy *= VMAX / sp2; }
  if (H.vx > 1.6) H.face = 1; else if (H.vx < -1.6) H.face = -1;
  if (H.x < 40) { H.x = 40; H.vx = Math.abs(H.vx) * 0.4; }
  if (H.y < -1400) { H.y = -1400; if (H.vy < 0) H.vy = 0; }

  if (L.end && !L.done) {
    if (H.x > L.end.x + 70) finishFlag();       /* crossing the tower finishes it, at any height */
    var ex = L.end.x + L.end.w + 340;
    if (H.x > ex) { H.x = ex; H.vx = -Math.abs(H.vx) * 0.4; }
  }

  collectables(); progress();
}

function progress() {
  cityUpdate(H.x);
  var m = Math.max(0, Math.floor((H.x - L.startX) / 50));
  L.dist = m;
  if (L.mode === "endless") {
    if (m > SAVE.bestDist) {
      if (SAVE.bestDist > 0 && !L.newBest && m > 5) { L.newBest = 1; toast("best"); SFX.saved(); burst(H.x, H.y - 30, 26, ["#ffd84d", "#7ef7a5", "#ffffff"]); }
      SAVE.bestDist = m; if (m % 25 === 0) save();
    }
  }
}

function collectables() {
  var i;
  for (i = 0; i < L.stars.length; i++) {
    var s = L.stars[i];
    if (s.got) continue;
    if (Math.abs(s.x - H.x) < 46 && Math.abs(s.y - H.y) < 46) {
      s.got = 1; L.starGot++; SFX.star();
      burst(s.x, s.y, 7, ["#ffd84d", "#fff3b0"]);
    }
  }
  for (i = 0; i < L.vic.length; i++) {
    var v = L.vic[i];
    if (v.state) continue;
    if (Math.abs(v.x - H.x) < 52 && Math.abs(v.y - H.y) < 58) {
      v.state = 2; L.saved++; SFX.saved();
      burst(v.x, v.y - 10, 18, ["#7ef7a5", "#ffe27a", "#ffffff"]);
      toast("saved");
      if (L.saved > SAVE.bestSaved) { SAVE.bestSaved = L.saved; save(); }
    }
  }
}

/* ============================================================
   CAMERA + RENDER
   ============================================================ */
var cam = { x: 0, y: 0, z: 1 };
function camUpdate(snap) {
  /* the camera follows a SMOOTHED version of his motion. Following the raw
     velocity is what made the whole picture shudder on every swing. */
  H.smx = H.smx === undefined ? H.vx : lerp(H.smx, H.vx, 0.035);
  H.smy = H.smy === undefined ? H.vy : lerp(H.smy, H.vy, 0.035);
  var tx = H.x - LW * 0.36 + clamp(H.smx * 16, -90, 130);
  var ty = H.y - LH * 0.46 + clamp(H.smy * 8, -70, 90);
  ty = Math.min(ty, GROUND + 40 - LH);
  if (snap) { cam.x = tx; cam.y = ty; cam.z = 1; }
  else { cam.x = lerp(cam.x, tx, 0.055); cam.y = lerp(cam.y, ty, 0.05); }
  cam.z = 1;
  cam.x = Math.max(cam.x, -60);
}

function drawSky() {
  var P = L.P;
  var g = ctx.createLinearGradient(0, 0, 0, LH);
  g.addColorStop(0, P.sky[0]); g.addColorStop(1, P.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, LW, LH);
  /* sun / moon */
  var sx = LW * 0.78 - cam.x * 0.02, sy = 100 - cam.y * 0.02;
  ctx.globalAlpha = 0.85; ctx.fillStyle = P.sun; circ(sx, sy, P.night ? 34 : 46); ctx.fill();
  ctx.globalAlpha = 0.16; circ(sx, sy, P.night ? 60 : 80); ctx.fill(); ctx.globalAlpha = 1;
  if (P.night) {
    var r = seeded(4242);
    ctx.fillStyle = "#ffffff";
    for (var i = 0; i < 70; i++) {
      var x = (r() * 2000 - cam.x * 0.05) % 1000, y = r() * 330 - cam.y * 0.05;
      if (x < -20) x += 1000;
      ctx.globalAlpha = 0.3 + r() * 0.6; ctx.fillRect(x, y, 2, 2);
    }
    ctx.globalAlpha = 1;
  }
  /* clouds */
  ctx.fillStyle = P.night ? "rgba(255,255,255,0.10)" : "rgba(255,255,255,0.62)";
  for (var c = 0; c < L.clouds.length; c++) {
    var cl = L.clouds[c], x2 = cl.x - cam.x * 0.14, y2 = cl.y - cam.y * 0.14;
    if (x2 < -300 || x2 > LW + 300) continue;
    var s = cl.s;
    circ(x2, y2, 30 * s); ctx.fill();
    circ(x2 + 34 * s, y2 + 6 * s, 24 * s); ctx.fill();
    circ(x2 - 32 * s, y2 + 8 * s, 20 * s); ctx.fill();
    circ(x2 + 12 * s, y2 - 16 * s, 22 * s); ctx.fill();
  }
}

var CAMREF = GROUND - LH;      /* camera height where the street sits on the screen bottom */
function drawSkyline(list, par, col, alpha) {
  ctx.globalAlpha = alpha; ctx.fillStyle = col;
  var base = LH - (cam.y - CAMREF) * par;      /* this layer's street line, in screen space */
  if (base < -60) { ctx.globalAlpha = 1; return; }
  for (var i = 0; i < list.length; i++) {
    var b = list[i], x = b.x - cam.x * par;
    if (x + b.w < -40 || x > LW + 40) continue;
    var y = base - b.h * (0.45 + par * 0.55);
    if (y > LH) continue;
    ctx.fillRect(x, y, b.w, LH - y + 10);
  }
  ctx.globalAlpha = 1;
}

function drawBuilding(b) {
  var P = L.P, x = b.x - cam.x, y = b.top - cam.y, h = GROUND - b.top + 300;
  if (x + b.w < -30 || x > LW + 30) return;
  ctx.fillStyle = P.bld; ctx.fillRect(x, y, b.w, h);
  ctx.fillStyle = P.bldD; ctx.fillRect(x + b.w - 12, y, 12, h);
  /* roof cap */
  ctx.fillStyle = P.roof; ctx.fillRect(x - 4, y - 10, b.w + 8, 12);
  /* windows */
  var r = seeded(Math.round(b.x) * 31 + 7);
  var cols = Math.max(1, Math.floor((b.w - 26) / 30));
  var padx = (b.w - cols * 22) / (cols + 1);
  ctx.fillStyle = P.win;
  for (var row = 0; row < 26; row++) {
    var wy = y + 30 + row * 40;
    if (wy > GROUND - cam.y - 20) break;
    if (wy > LH + 20) break;
    for (var cIdx = 0; cIdx < cols; cIdx++) {
      var lit = r();
      if (wy < -30) continue;
      ctx.globalAlpha = P.night ? (lit > 0.45 ? 0.95 : 0.10) : (lit > 0.7 ? 0.85 : 0.45);
      ctx.fillRect(x + padx + cIdx * (22 + padx), wy, 22, 26);
    }
  }
  ctx.globalAlpha = 1;
  /* roof props */
  var pr = seeded(Math.round(b.x) * 17 + 3);
  if (b.w > 110 && !b.flag && y > -60 && y < LH + 40) {
    var kind = Math.floor(pr() * 3);
    ctx.fillStyle = P.roof;
    if (kind === 0) { rr(x + 14, y - 34, 30, 26, 5); ctx.fill(); ctx.fillStyle = P.bldD; ctx.fillRect(x + 20, y - 44, 5, 12); ctx.fillRect(x + 33, y - 44, 5, 12); }
    else if (kind === 1) {
      ctx.strokeStyle = P.roof; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(x + b.w - 34, y - 8); ctx.lineTo(x + b.w - 34, y - 62); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + b.w - 46, y - 34); ctx.lineTo(x + b.w - 22, y - 34); ctx.stroke();
      ctx.fillStyle = "#ff6b6b"; circ(x + b.w - 34, y - 66, 4); ctx.fill();
    } else { ctx.fillStyle = P.roof; rr(x + b.w * 0.5 - 22, y - 22, 44, 16, 4); ctx.fill(); rr(x + 12, y - 16, 20, 10, 3); ctx.fill(); }
  }
  /* flag tower */
  if (b.flag) {
    /* full-height finish banner — he flies past well below the roof */
    var bx0 = x + b.w * 0.30, bw0 = b.w * 0.40;
    ctx.globalAlpha = 0.28; ctx.fillStyle = "#ffd84d"; ctx.fillRect(bx0 - 24, y - 6, bw0 + 48, LH + 400); ctx.globalAlpha = 1;
    ctx.fillStyle = "#ffffff"; ctx.fillRect(bx0, y - 4, bw0, LH + 400);
    ctx.fillStyle = "#d8232a";
    for (var q = 0; q < 40; q++) {
      var qy = y + q * 46;
      if (qy > LH + 60) break;
      ctx.fillRect(bx0 + (q % 2 ? 0 : bw0 / 2), qy, bw0 / 2, 46);
    }
    var fx = x + b.w - 46, fy = y - 10;
    ctx.strokeStyle = "#dfe9f2"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx, fy - 96); ctx.stroke();
    ctx.fillStyle = "#ffd84d";
    var wav = Math.sin(H.t * 0.09) * 5;
    ctx.beginPath(); ctx.moveTo(fx, fy - 96); ctx.quadraticCurveTo(fx + 36, fy - 88 + wav, fx + 66, fy - 80);
    ctx.lineTo(fx + 66, fy - 52); ctx.quadraticCurveTo(fx + 34, fy - 60 - wav, fx, fy - 58); ctx.closePath(); ctx.fill();
    var pulse2 = 0.5 + 0.5 * Math.sin(H.t * 0.07);
    var fg = ctx.createLinearGradient(0, y - 200, 0, y);
    fg.addColorStop(0, "rgba(255,216,77,0)"); fg.addColorStop(1, "rgba(255,216,77," + (0.16 + pulse2 * 0.16).toFixed(3) + ")");
    ctx.fillStyle = fg; ctx.fillRect(x + 10, y - 200, b.w - 20, 200);
  }
}

function drawFore() {
  var P = L.P, base = LH - (cam.y - CAMREF) * 1.34;
  for (var i = 0; i < L.fore.length; i++) {
    var b = L.fore[i], x = b.x - cam.x * 1.34;
    if (x + b.w < -60 || x > LW + 60) continue;
    var y = base - b.h;
    var hsx = H.x - cam.x;
    var over = hsx > x - 44 && hsx < x + b.w + 44;
    ctx.globalAlpha = over ? 0.46 : 1;
    ctx.fillStyle = P.bldD; ctx.fillRect(x, y, b.w, LH - y + 400);
    ctx.fillStyle = "rgba(6,14,26,0.34)"; ctx.fillRect(x, y, b.w, LH - y + 400);
    ctx.fillStyle = "rgba(255,255,255,0.06)"; ctx.fillRect(x, y, 14, LH - y + 400);
    ctx.fillStyle = "rgba(6,14,26,0.30)"; ctx.fillRect(x - 8, y - 16, b.w + 16, 18);
    /* a few big windows so it reads as a building whipping past */
    var r = seeded(Math.round(b.x) * 41 + 11);
    ctx.fillStyle = P.night ? "rgba(255,233,163,0.30)" : "rgba(255,255,255,0.10)";
    for (var row = 0; row < 14; row++) {
      var wy = y + 40 + row * 74;
      if (wy > LH + 40) break;
      for (var c = 0; c < 3; c++) { if (r() > 0.45) ctx.fillRect(x + 22 + c * (b.w - 60) / 2.4, wy, 40, 48); }
    }
    ctx.globalAlpha = 1;
  }
}

function drawStreet() {
  var P = L.P, y = GROUND - cam.y;
  if (y > LH + 40) return;
  var g = ctx.createLinearGradient(0, y - 220, 0, y + 60);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, P.fog);
  ctx.fillStyle = g; ctx.fillRect(0, y - 220, LW, 280);
  ctx.fillStyle = P.night ? "#1a2440" : "#8a99a8"; ctx.fillRect(0, y, LW, LH);
}

function drawStar(s) {
  if (s.got) return;
  var x = s.x - cam.x, y = s.y - cam.y;
  if (x < -40 || x > LW + 40 || y < -40 || y > LH + 40) return;
  var b = Math.sin(H.t * 0.07 + s.t) * 3;
  ctx.globalAlpha = 0.30; ctx.fillStyle = "#ffd84d"; circ(x, y + b, 18); ctx.fill(); ctx.globalAlpha = 1;
  ctx.fillStyle = "#ffd84d"; starPath(x, y + b, 14, 5, 0.45, H.t * 0.02); ctx.fill();
  ctx.fillStyle = "#fff6c9"; starPath(x, y + b, 7, 5, 0.45, H.t * 0.02); ctx.fill();
}

function drawPerson(x, y, s, body, wave, sad) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = "rgba(0,0,0,0.16)"; ctx.beginPath(); ctx.ellipse(0, 20, 13, 4, 0, 0, TAU); ctx.fill();
  ctx.fillStyle = body; rr(-9, -6, 18, 26, 7); ctx.fill();
  ctx.strokeStyle = body; ctx.lineWidth = 5; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-7, 2); ctx.lineTo(-15 - wave * 2, -8 - wave * 9); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(7, 2); ctx.lineTo(15, 8); ctx.stroke();
  ctx.fillStyle = "#f7c9a3"; circ(0, -16, 12); ctx.fill();
  ctx.fillStyle = "#3a2a22"; circ(-4, -18, 2.2); ctx.fill(); circ(4, -18, 2.2); ctx.fill();
  ctx.strokeStyle = "#3a2a22"; ctx.lineWidth = 2;
  ctx.beginPath();
  if (sad) ctx.arc(0, -8, 4.5, Math.PI * 1.15, Math.PI * 1.85);
  else ctx.arc(0, -11, 4.5, 0.15, Math.PI - 0.15);
  ctx.stroke();
  ctx.restore();
}

function drawVictims() {
  for (var i = 0; i < L.vic.length; i++) {
    var v = L.vic[i];
    var x = v.x - cam.x, y = v.y - cam.y;
    if (x < -60 || x > LW + 60) continue;
    var wave = v.state === 2 ? 1 : (Math.sin(H.t * 0.16 + v.t) > 0 ? 1 : 0.2);
    if (v.state === 0) {
      var p = 0.5 + 0.5 * Math.sin(H.t * 0.07 + v.t);
      ctx.globalAlpha = 0.25 + p * 0.3; ctx.fillStyle = "#8fd8ff";
      circ(x, y - 8, 34 + p * 6); ctx.fill(); ctx.globalAlpha = 1;
      /* help arrow */
      ctx.fillStyle = "#ffffff"; ctx.globalAlpha = 0.8;
      var ay = y - 66 - p * 8;
      ctx.beginPath(); ctx.moveTo(x, ay + 16); ctx.lineTo(x - 11, ay); ctx.lineTo(x + 11, ay); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
    drawPerson(x, y, 1, v.state === 2 ? "#7ef7a5" : "#ff9ec4", wave, v.state === 0);
  }
}


/* ---------- the web hero ---------- */
var SUIT = "#d8232a", SUITD = "#a8151c", LEG = "#2450b8", LEGD = "#1b3b8a", WEBC = "rgba(20,20,30,0.45)";
function heroWeblines(w, h) {
  ctx.strokeStyle = WEBC; ctx.lineWidth = 0.9;
  for (var i = -1; i <= 1; i++) {
    ctx.beginPath(); ctx.moveTo(i * w * 0.5, -h); ctx.lineTo(i * w * 0.5 * 0.4, h); ctx.stroke();
  }
  for (var j = -1; j <= 1; j++) {
    ctx.beginPath(); ctx.moveTo(-w * 0.55, j * h * 0.5); ctx.lineTo(w * 0.55, j * h * 0.5); ctx.stroke();
  }
}
function drawHeroBody(t, opt) {
  /* drawn around the chest origin, facing +x */
  var swing = opt.rope, roof = opt.roof, aimA = opt.aim, flap = Math.sin(t * 0.3) * 3;
  /* back leg */
  ctx.strokeStyle = LEGD; ctx.lineWidth = 8; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-1, 10);
  if (roof) ctx.lineTo(-6, 25); else ctx.lineTo(-19, 17 + flap * 0.6);
  ctx.stroke();
  ctx.fillStyle = SUITD; circ(roof ? -6 : -19, roof ? 26 : 17 + flap * 0.6, 5); ctx.fill();
  /* back arm */
  ctx.strokeStyle = LEGD; ctx.lineWidth = 6.5;
  ctx.beginPath(); ctx.moveTo(-1, -5);
  ctx.lineTo(roof ? -11 : -15, roof ? 7 : 6); ctx.stroke();
  /* torso */
  ctx.fillStyle = SUIT; rr(-9, -11, 19, 25, 8); ctx.fill();
  ctx.save(); ctx.beginPath(); rr(-9, -11, 19, 25, 8); ctx.clip();
  ctx.translate(0.5, 1); heroWeblines(20, 14); ctx.restore();
  /* hips / legs in blue */
  ctx.fillStyle = LEG; rr(-8, 4, 17, 12, 5); ctx.fill();
  /* spider emblem */
  ctx.fillStyle = "#231f20";
  circ(1, -3, 2.4); ctx.fill();
  ctx.strokeStyle = "#231f20"; ctx.lineWidth = 1.1;
  for (var k = 0; k < 4; k++) {
    var a2 = 0.5 + k * 0.6;
    ctx.beginPath(); ctx.moveTo(1, -3); ctx.quadraticCurveTo(1 + Math.cos(a2) * 5, -3 - Math.sin(a2) * 3, 1 + Math.cos(a2) * 7, -3 + Math.sin(a2) * 4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(1, -3); ctx.quadraticCurveTo(1 - Math.cos(a2) * 5, -3 - Math.sin(a2) * 3, 1 - Math.cos(a2) * 7, -3 + Math.sin(a2) * 4); ctx.stroke();
  }
  /* front leg */
  ctx.strokeStyle = LEG; ctx.lineWidth = 8.5;
  ctx.beginPath(); ctx.moveTo(3, 11);
  if (roof) ctx.lineTo(7, 25); else ctx.lineTo(-8, 27 + flap * 0.5);
  ctx.stroke();
  ctx.fillStyle = SUITD; circ(roof ? 7 : -8, roof ? 26 : 27 + flap * 0.5, 5.4); ctx.fill();
  /* head */
  ctx.fillStyle = SUIT; circ(3, -23, 12.5); ctx.fill();
  ctx.save(); ctx.beginPath(); circ(3, -23, 12.5); ctx.clip();
  ctx.translate(3, -23); heroWeblines(26, 13); ctx.restore();
  /* eyes */
  function eye(ex, ey, w, h2, rot) {
    ctx.save(); ctx.translate(ex, ey); ctx.rotate(rot);
    ctx.fillStyle = "#141824"; ctx.beginPath(); ctx.ellipse(0, 0, w + 1.3, h2 + 1.3, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.ellipse(0, 0, w, h2, 0, 0, TAU); ctx.fill();
    ctx.restore();
  }
  eye(8.5, -25, 5.4, 3.7, -0.30);
  eye(-1.5, -25.5, 4.0, 3.0, -0.30);
  /* front arm: reaches for the web line, or forward in flight */
  ctx.strokeStyle = LEG; ctx.lineWidth = 7; ctx.lineCap = "round";
  var hx2, hy2;
  if (swing) { hx2 = Math.cos(aimA) * 21; hy2 = -5 + Math.sin(aimA) * 21; }
  else if (roof) { hx2 = 13; hy2 = 6; }
  else { hx2 = 21; hy2 = -9; }
  ctx.beginPath(); ctx.moveTo(2, -6); ctx.lineTo(hx2, hy2); ctx.stroke();
  ctx.fillStyle = SUIT; circ(hx2, hy2, 5.2); ctx.fill();
  return { hx: hx2, hy: hy2 };
}

function drawHero() {
  var x = H.x - cam.x, y = H.y - cam.y;
  var tAng = clamp(Math.atan2(H.vy, H.vx) * (H.face > 0 ? 1 : -1), -1.15, 1.15) * 0.55;
  if (H.ang === undefined) H.ang = tAng;
  H.ang = lerp(H.ang, tAng, 0.10);
  var ang = H.ang;
  var aim = 0;
  if (H.rope) {
    var lax = (H.rope.ax - cam.x - x) * H.face, lay = H.rope.ay - cam.y - y;
    aim = Math.atan2(lay, lax) - ang;
  }
  var HS = 1.32;
  ctx.save(); ctx.translate(x, y); ctx.scale(H.face * HS, HS); ctx.rotate(ang);
  var hand = drawHeroBody(H.t, { rope: !!H.rope, roof: 0, aim: aim });
  ctx.restore();
  hand = { hx: hand.hx * HS, hy: hand.hy * HS };
  H.handX = x + Math.cos(ang) * hand.hx * H.face - Math.sin(ang) * hand.hy * H.face * 0;
  H.handY = y + Math.sin(ang) * hand.hx + Math.cos(ang) * hand.hy;
  H.handX = x + (Math.cos(ang) * hand.hx - Math.sin(ang) * hand.hy) * H.face;
  H.handY = y + Math.sin(ang) * hand.hx * H.face + Math.cos(ang) * hand.hy;
}

function drawRope() {
  if (!H.rope) return;
  var ax = H.rope.ax - cam.x, ay = H.rope.ay - cam.y;
  var hx = H.handX === undefined ? H.x - cam.x : H.handX;
  var hy = H.handY === undefined ? H.y - cam.y : H.handY;
  ctx.strokeStyle = "rgba(255,255,255,0.95)";
  ctx.lineWidth = 3.4 + H.arm * 2;
  ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(ax, ay); ctx.stroke();
  ctx.fillStyle = "#ffffff"; circ(ax, ay, 5 + H.arm * 4); ctx.fill();
  if (H.arm > 0.2) {
    ctx.globalAlpha = H.arm * 0.6; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
    circ(ax, ay, 10 + (1 - H.arm) * 22); ctx.stroke(); ctx.globalAlpha = 1;
  }
}
function drawSpeed() {
  var sp = hyp(H.vx, H.vy);
  if (sp < 40 || H.bubble) return;
  var a = clamp((sp - 13) / 12, 0, 1) * 0.5;
  var ux = H.vx / sp, uy = H.vy / sp;
  ctx.strokeStyle = "rgba(255,255,255," + a.toFixed(3) + ")"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
  var r2 = seeded(Math.floor(H.t / 3) * 977 + 5);
  for (var i = 0; i < 7; i++) {
    var off = (r2() - 0.5) * 190, dist = 40 + r2() * 150, len = 22 + r2() * 40;
    var bx2 = H.x - cam.x - ux * dist - uy * off, by2 = H.y - cam.y - uy * dist + ux * off;
    ctx.beginPath(); ctx.moveTo(bx2, by2); ctx.lineTo(bx2 - ux * len, by2 - uy * len); ctx.stroke();
  }
}

function drawParts() {
  for (var i = parts.length - 1; i >= 0; i--) {
    var p = parts[i]; p.t++;
    p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.vx *= 0.99;
    if (p.t > p.life) { parts.splice(i, 1); continue; }
    ctx.globalAlpha = 1 - p.t / p.life; ctx.fillStyle = p.c;
    if (p.sp) { starPath(p.x - cam.x, p.y - cam.y, p.s * 1.6, 5, 0.45, p.t * 0.1); ctx.fill(); }
    else ctx.fillRect(p.x - cam.x - p.s / 2, p.y - cam.y - p.s / 2, p.s, p.s);
  }
  ctx.globalAlpha = 1;
}


/* ============================================================
   UI
   ============================================================ */
var state = "title", wonT = 0, hits = [], hintT = 0, titleT = 0;

function hit(id, x, y, w, h) { hits.push({ id: id, x: x, y: y, w: w, h: h }); }
function shadowText(t, x, y, size, col, align) {
  ctx.font = "800 " + size + "px system-ui,-apple-system,Segoe UI,Roboto,sans-serif";
  ctx.textAlign = align || "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.fillText(t, x + 2, y + 3);
  ctx.fillStyle = col; ctx.fillText(t, x, y);
}
function panel(x, y, w, h, r) {
  ctx.fillStyle = "rgba(9,20,36,0.88)"; rr(x, y, w, h, r || 22); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.16)"; ctx.lineWidth = 3; ctx.stroke();
}
function bigBtn(id, x, y, w, h, col, icon) {
  hit(id, x, y, w, h);
  ctx.fillStyle = "rgba(0,0,0,0.28)"; rr(x + 3, y + 5, w, h, 18); ctx.fill();
  ctx.fillStyle = col; rr(x, y, w, h, 18); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 3; ctx.stroke();
  icon(x + w / 2, y + h / 2, Math.min(w, h));
}
function iconPlay(cx, cy, s) { ctx.fillStyle = "#ffffff"; var r = s * 0.26; ctx.beginPath(); ctx.moveTo(cx - r * 0.7, cy - r); ctx.lineTo(cx + r, cy); ctx.lineTo(cx - r * 0.7, cy + r); ctx.closePath(); ctx.fill(); }
function iconPause(cx, cy, s) { ctx.fillStyle = "#ffffff"; var r = s * 0.22; rr(cx - r, cy - r, r * 0.72, r * 2, 3); ctx.fill(); rr(cx + r * 0.28, cy - r, r * 0.72, r * 2, 3); ctx.fill(); }
function iconHome(cx, cy, s) {
  ctx.fillStyle = "#ffffff"; var r = s * 0.24;
  ctx.beginPath(); ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r, cy); ctx.lineTo(cx + r * 0.62, cy); ctx.lineTo(cx + r * 0.62, cy + r * 0.8);
  ctx.lineTo(cx - r * 0.62, cy + r * 0.8); ctx.lineTo(cx - r * 0.62, cy); ctx.lineTo(cx - r, cy); ctx.closePath(); ctx.fill();
}
function iconRetry(cx, cy, s) {
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = s * 0.10; var r = s * 0.24;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0.6, Math.PI * 1.75); ctx.stroke();
  ctx.fillStyle = "#ffffff"; ctx.beginPath();
  ctx.moveTo(cx + r * 0.86, cy - r * 0.95); ctx.lineTo(cx + r * 1.35, cy - r * 0.05); ctx.lineTo(cx + r * 0.25, cy - r * 0.30); ctx.closePath(); ctx.fill();
}
function iconSpeaker(cx, cy, s, on) {
  ctx.fillStyle = "#ffffff"; var r = s * 0.20;
  ctx.beginPath(); ctx.moveTo(cx - r, cy - r * 0.45); ctx.lineTo(cx - r * 0.45, cy - r * 0.45); ctx.lineTo(cx + r * 0.1, cy - r); ctx.lineTo(cx + r * 0.1, cy + r); ctx.lineTo(cx - r * 0.45, cy + r * 0.45); ctx.lineTo(cx - r, cy + r * 0.45); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = s * 0.07; ctx.lineCap = "round";
  if (on) { ctx.beginPath(); ctx.arc(cx + r * 0.2, cy, r * 0.7, -0.9, 0.9); ctx.stroke(); ctx.beginPath(); ctx.arc(cx + r * 0.2, cy, r * 1.15, -0.9, 0.9); ctx.stroke(); }
  else { ctx.beginPath(); ctx.moveTo(cx + r * 0.5, cy - r * 0.5); ctx.lineTo(cx + r * 1.2, cy + r * 0.5); ctx.moveTo(cx + r * 1.2, cy - r * 0.5); ctx.lineTo(cx + r * 0.5, cy + r * 0.5); ctx.stroke(); }
}
function iconNote(cx, cy, s, on) {
  ctx.fillStyle = "#ffffff"; var r = s * 0.20;
  circ(cx - r * 0.4, cy + r * 0.6, r * 0.42); ctx.fill();
  ctx.fillRect(cx - r * 0.05, cy - r * 0.9, r * 0.20, r * 1.5);
  ctx.beginPath(); ctx.moveTo(cx - r * 0.05, cy - r * 0.9); ctx.lineTo(cx + r * 0.8, cy - r * 1.15); ctx.lineTo(cx + r * 0.8, cy - r * 0.72); ctx.lineTo(cx - r * 0.05, cy - r * 0.47); ctx.closePath(); ctx.fill();
  if (!on) { ctx.strokeStyle = "#ff6b6b"; ctx.lineWidth = s * 0.09; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(cx - r * 1.1, cy - r * 1.1); ctx.lineTo(cx + r * 1.1, cy + r * 1.1); ctx.stroke(); }
}
/* mode icons */
function iconEndless(cx, cy, s) {
  var r = s * 0.19;
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = s * 0.085; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.arc(cx - r * 0.62, cy, r * 0.62, 0, TAU);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(cx + r * 0.62, cy, r * 0.62, 0, TAU); ctx.stroke();
}
function iconFlag(cx, cy, s) {
  var r = s * 0.24;
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = s * 0.075; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(cx - r * 0.55, cy + r); ctx.lineTo(cx - r * 0.55, cy - r); ctx.stroke();
  ctx.fillStyle = "#ffffff";
  ctx.beginPath(); ctx.moveTo(cx - r * 0.45, cy - r); ctx.lineTo(cx + r, cy - r * 0.55); ctx.lineTo(cx - r * 0.45, cy - r * 0.1); ctx.closePath(); ctx.fill();
}
function iconRescue(cx, cy, s) {
  var r = s * 0.22;
  ctx.fillStyle = "#ffffff";
  circ(cx, cy - r * 0.62, r * 0.42); ctx.fill();
  rr(cx - r * 0.42, cy - r * 0.12, r * 0.84, r * 0.78, r * 0.3); ctx.fill();
  ctx.strokeStyle = "#ffffff"; ctx.lineWidth = s * 0.075; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(cx - r * 0.42, cy); ctx.lineTo(cx - r, cy - r * 0.7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + r * 0.42, cy); ctx.lineTo(cx + r, cy - r * 0.7); ctx.stroke();
}
function iconNext(cx, cy, s) {
  ctx.fillStyle = "#ffffff"; var r = s * 0.22;
  ctx.beginPath(); ctx.moveTo(cx - r * 0.9, cy - r); ctx.lineTo(cx + r * 0.2, cy); ctx.lineTo(cx - r * 0.9, cy + r); ctx.closePath(); ctx.fill();
  rr(cx + r * 0.38, cy - r, r * 0.42, r * 2, 3); ctx.fill();
}
function iconStar(cx, cy, s) { ctx.fillStyle = "#ffd84d"; starPath(cx, cy, s * 0.26, 5, 0.45, 0); ctx.fill(); }

/* ---------- title ---------- */
function titleBg() {
  var g = ctx.createLinearGradient(0, 0, 0, LH);
  g.addColorStop(0, "#12305c"); g.addColorStop(1, "#4a86c4");
  ctx.fillStyle = g; ctx.fillRect(0, 0, LW, LH);
  var r = seeded(5), px = -40;
  ctx.fillStyle = "rgba(9,26,50,0.42)";
  while (px < LW + 60) { var w = 60 + r() * 110, h = 130 + r() * 250; ctx.fillRect(px, LH - h, w, h); px += w + 10 + r() * 40; }
  ctx.fillStyle = "rgba(9,26,50,0.72)";
  px = -40; r = seeded(9);
  while (px < LW + 60) { var w2 = 80 + r() * 120, h2 = 70 + r() * 160; ctx.fillRect(px, LH - h2, w2, h2); px += w2 + 14 + r() * 50; }
}
function drawTitle() {
  titleT++;
  titleBg();
  shadowText("SKY SWING", LW / 2, 66, 60, "#ffffff");

  var bw = 252, bh = 156, gap = 26, gx = (LW - 3 * bw - 2 * gap) / 2, gy = 246;
  var lv = clamp(SAVE.level || 1, 1, MAXLVL);
  modeCard("m_endless", gx, gy, bw, bh, "#2f6fd0", iconEndless, "DISTANCE", SAVE.bestDist ? SAVE.bestDist + " m" : "");
  modeCard("m_flag", gx + bw + gap, gy, bw, bh, "#2ea05a", iconFlag, "LEVELS", "Lv " + lv);
  modeCard("m_rescue", gx + 2 * (bw + gap), gy, bw, bh, "#d8232a", iconRescue, "RESCUE", SAVE.bestSaved ? String(SAVE.bestSaved) : "");

  bigBtn("sfx", 24, LH - 72, 52, 52, SAVE.sfx ? "#2f6fd0" : "#4b5a68", function (x, y, s) { iconSpeaker(x, y, s, SAVE.sfx); });
  bigBtn("mus", 88, LH - 72, 52, 52, SAVE.mus ? "#2f6fd0" : "#4b5a68", function (x, y, s) { iconNote(x, y, s, SAVE.mus); });

  /* he swings across in front of everything */
  var a = Math.sin(titleT * 0.020) * 0.80;
  var ax = LW * 0.5, ay = -70, len = 290;
  var hx = ax + Math.sin(a) * len, hy = ay + Math.cos(a) * len;
  var ang = -a * 0.85;
  ctx.save(); ctx.translate(hx, hy); ctx.scale(1.95, 1.95); ctx.rotate(ang);
  var hand = drawHeroBody(titleT, { rope: 1, roof: 0, aim: Math.atan2(ay - hy, ax - hx) - ang });
  ctx.restore();
  ctx.strokeStyle = "rgba(255,255,255,0.95)"; ctx.lineWidth = 3.4;
  ctx.beginPath();
  ctx.moveTo(hx + (Math.cos(ang) * hand.hx - Math.sin(ang) * hand.hy) * 1.95, hy + (Math.sin(ang) * hand.hx + Math.cos(ang) * hand.hy) * 1.95);
  ctx.lineTo(ax, ay); ctx.stroke();
}

function modeCard(id, x, y, w, h, col, icon, label, best) {
  hit(id, x, y, w, h);
  ctx.fillStyle = "rgba(0,0,0,0.30)"; rr(x + 3, y + 6, w, h, 20); ctx.fill();
  ctx.fillStyle = col; rr(x, y, w, h, 20); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.45)"; ctx.lineWidth = 3; ctx.stroke();
  icon(x + w / 2, y + h * 0.30, h * 0.78);
  shadowText(label, x + w / 2, y + h * 0.63, 30, "#ffffff");
  if (best) {
    ctx.fillStyle = "rgba(0,0,0,0.30)"; rr(x + w / 2 - 58, y + h - 44, 116, 32, 16); ctx.fill();
    ctx.fillStyle = "#ffd84d"; starPath(x + w / 2 - 38, y + h - 28, 10, 5, 0.45, 0); ctx.fill();
    shadowText(best, x + w / 2 + 10, y + h - 27, 20, "#ffffff");
  }
}

/* ---------- in-game HUD ---------- */
function drawHUD() {
  if (L.mode === "flag") {
    var pr = clamp((H.x - L.startX) / ((L.end ? L.end.x : L.cfg.end) - L.startX), 0, 1);
    ctx.fillStyle = "rgba(6,16,30,0.55)"; ctx.fillRect(0, 0, LW, 12);
    ctx.fillStyle = "#ffd84d"; ctx.fillRect(0, 0, LW * pr, 12);
    ctx.fillStyle = "#ffffff"; circ(LW * pr, 6, 8); ctx.fill();
    ctx.fillStyle = "rgba(6,16,30,0.55)"; rr(16, 26, 168, 36, 18); ctx.fill();
    ctx.fillStyle = "#ffffff"; iconFlag(40, 44, 40);
    shadowText("Lv " + (L.cfg.lv || 1), 88, 45, 20, "#ffffff");
    shadowText(Math.round(L.time) + "s", 152, 45, 20, "#ffd84d");
  } else {
    ctx.fillStyle = "rgba(6,16,30,0.55)"; rr(16, 22, 152, 40, 20); ctx.fill();
    shadowText(L.dist + " m", 92, 43, 26, "#ffffff");
    var bestv = L.mode === "endless" ? SAVE.bestDist : 0;
    if (L.mode === "endless" && bestv > L.dist) {
      ctx.globalAlpha = 0.8; ctx.fillStyle = "#ffd84d"; starPath(30, 76, 9, 5, 0.45, 0); ctx.fill();
      shadowText(bestv + " m", 76, 77, 16, "#ffffff"); ctx.globalAlpha = 1;
    }
    if (L.mode === "rescue") {
      ctx.fillStyle = "rgba(6,16,30,0.55)"; rr(180, 22, 116, 40, 20); ctx.fill();
      ctx.fillStyle = "#7ef7a5"; iconRescue(206, 42, 44);
      shadowText(String(L.saved), 254, 43, 24, "#ffffff");
    }
  }
  ctx.fillStyle = "rgba(6,16,30,0.55)"; rr(LW - 152, 22, 90, 36, 18); ctx.fill();
  ctx.fillStyle = "#ffd84d"; starPath(LW - 130, 40, 12, 5, 0.45, 0); ctx.fill();
  shadowText(String(L.starGot), LW - 96, 41, 20, "#ffffff");
  if (state === "play" || state === "paused") bigBtn("pause", LW - 56, 22, 44, 40, "#2f6fd0", iconPause);

  if (hintT > 0) {
    hintT--;
    var al = clamp(hintT / 70, 0, 1);
    ctx.globalAlpha = al;
    var hx = LW / 2, hy = LH - 62;
    ctx.fillStyle = "rgba(6,16,30,0.72)"; rr(hx - 130, hy - 36, 260, 72, 22); ctx.fill();
    var p = (H.t % 100) / 100;
    ctx.strokeStyle = "rgba(255,255,255,0.85)"; ctx.lineWidth = 4;
    circ(hx - 74, hy, 20 - p * 6); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.95)"; circ(hx - 74, hy, 12); ctx.fill();
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(hx + 34, hy + 10, 40, Math.PI * 1.12, Math.PI * 1.92); ctx.stroke();
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.moveTo(hx + 74, hy - 4); ctx.lineTo(hx + 58, hy - 16); ctx.lineTo(hx + 60, hy + 4); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }
  for (var t = toasts.length - 1; t >= 0; t--) {
    var to = toasts[t]; to.t++;
    if (to.t > 90) { toasts.splice(t, 1); continue; }
    var a2 = to.t < 12 ? to.t / 12 : to.t > 70 ? (90 - to.t) / 20 : 1;
    ctx.globalAlpha = a2;
    var ty = 118 - (to.t > 70 ? (to.t - 70) : 0);
    ctx.fillStyle = to.kind === "best" ? "rgba(216,35,42,0.94)" : "rgba(46,160,90,0.94)";
    rr(LW / 2 - 90, ty - 26, 180, 52, 22); ctx.fill();
    if (to.kind === "best") { ctx.fillStyle = "#ffd84d"; starPath(LW / 2 - 46, ty, 18, 5, 0.45, to.t * 0.06); ctx.fill(); shadowText("!", LW / 2 + 30, ty, 30, "#ffffff"); }
    else { ctx.fillStyle = "#ffffff"; iconRescue(LW / 2 - 40, ty, 52); ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(LW / 2 + 6, ty + 2); ctx.lineTo(LW / 2 + 20, ty + 16); ctx.lineTo(LW / 2 + 46, ty - 14); ctx.stroke(); }
    ctx.globalAlpha = 1;
  }
}

function drawPause() {
  ctx.fillStyle = "rgba(4,12,24,0.62)"; ctx.fillRect(0, 0, LW, LH);
  panel(LW / 2 - 210, LH / 2 - 130, 420, 260);
  bigBtn("resume", LW / 2 - 55, LH / 2 - 96, 110, 84, "#2ea05a", iconPlay);
  bigBtn("retry", LW / 2 - 168, LH / 2 + 6, 96, 76, "#2f6fd0", iconRetry);
  bigBtn("home", LW / 2 - 48, LH / 2 + 6, 96, 76, "#2f6fd0", iconHome);
  bigBtn("sfx", LW / 2 + 72, LH / 2 + 6, 44, 76, SAVE.sfx ? "#2f6fd0" : "#4b5a68", function (x, y) { iconSpeaker(x, y, 52, SAVE.sfx); });
  bigBtn("mus", LW / 2 + 124, LH / 2 + 6, 44, 76, SAVE.mus ? "#2f6fd0" : "#4b5a68", function (x, y) { iconNote(x, y, 52, SAVE.mus); });
}

function drawWon() {
  wonT++;
  if (wonT % 7 === 0 && wonT < 120) burst(H.x + rnd(-200, 200), H.y - 200 - rnd(0, 60), 3, ["#ffd84d", "#ff7ba8", "#7ef7a5", "#8fd8ff", "#ffffff"]);
  ctx.fillStyle = "rgba(4,12,24,0.55)"; ctx.fillRect(0, 0, LW, LH);
  var pop = clamp(wonT / 16, 0, 1), sc = 0.7 + pop * 0.3;
  ctx.save(); ctx.translate(LW / 2, LH / 2); ctx.scale(sc, sc); ctx.translate(-LW / 2, -LH / 2);
  panel(LW / 2 - 230, LH / 2 - 140, 460, 270);
  ctx.fillStyle = "#ffd84d";
  rr(LW / 2 - 30, LH / 2 - 118, 60, 52, 12); ctx.fill();
  ctx.strokeStyle = "#ffd84d"; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.arc(LW / 2 - 42, LH / 2 - 102, 14, Math.PI * 0.4, Math.PI * 1.6); ctx.stroke();
  ctx.beginPath(); ctx.arc(LW / 2 + 42, LH / 2 - 102, 14, Math.PI * 1.4, Math.PI * 0.6); ctx.stroke();
  ctx.fillStyle = "#ffd84d"; ctx.fillRect(LW / 2 - 8, LH / 2 - 66, 16, 20); rr(LW / 2 - 30, LH / 2 - 48, 60, 12, 5); ctx.fill();
  shadowText("Lv " + (L.lv || 1), LW / 2 - 118, LH / 2 - 4, 30, "#7ef7a5");
  shadowText(Math.round(L.time) + "s", LW / 2 - 18, LH / 2 - 4, 32, "#ffffff");
  ctx.fillStyle = "#ffd84d"; starPath(LW / 2 + 42, LH / 2 - 6, 18, 5, 0.45, 0); ctx.fill();
  shadowText(String(L.starGot), LW / 2 + 100, LH / 2 - 4, 30, "#ffffff");
  if (L.newBest) { ctx.globalAlpha = 0.9; shadowText("BEST!", LW / 2, LH / 2 + 40, 24, "#ffd84d"); ctx.globalAlpha = 1; }
  ctx.restore();
  if (wonT > 14) {
    bigBtn("home", LW / 2 - 176, LH / 2 + 78, 96, 72, "#4b5a68", iconHome);
    bigBtn("retry", LW / 2 - 48, LH / 2 + 78, 96, 72, "#2f6fd0", iconRetry);
    bigBtn("next", LW / 2 + 80, LH / 2 + 78, 96, 72, "#2ea05a", iconNext);
  }
}

/* ============================================================
   INPUT
   ============================================================ */
var down = {};
function toLogical(e) {
  var rect = cv.getBoundingClientRect();
  return { x: (e.clientX - rect.left - offX) / scale, y: (e.clientY - rect.top - offY) / scale };
}
function hitAt(p) {
  for (var i = hits.length - 1; i >= 0; i--) {
    var h = hits[i];
    if (p.x >= h.x - 10 && p.x <= h.x + h.w + 10 && p.y >= h.y - 10 && p.y <= h.y + h.h + 10) return h.id;
  }
  return null;
}
function startRun(mode) {
  newCity(mode); resetHero(); camUpdate(true);
  parts.length = 0; toasts.length = 0;
  held = false; down = {};
  state = "play";
  hintT = SAVE.seen < 4 ? 420 : 150;
  SAVE.seen = (SAVE.seen || 0) + 1; save();
}
function anyDown() { for (var k in down) if (down[k]) return true; return false; }
function doAction(id) {
  audioInit(); SFX.tap();
  if (id === "m_endless") return startRun("endless");
  if (id === "m_flag") return startRun("flag");
  if (id === "m_rescue") return startRun("rescue");
  if (id === "sfx") { SAVE.sfx = SAVE.sfx ? 0 : 1; save(); return; }
  if (id === "mus") { SAVE.mus = SAVE.mus ? 0 : 1; save(); return; }
  if (id === "pause") { held = false; down = {}; state = "paused"; return; }
  if (id === "resume") { state = "play"; return; }
  if (id === "retry") { if (L.mode === "flag") forceLv = L.cfg.lv || 1; save(); return startRun(L.mode); }
  if (id === "next") { save(); return startRun("flag"); }
  if (id === "home") { save(); state = "title"; held = false; down = {}; return; }
}
function onDown(e) {
  audioInit();
  if (AC && AC.state === "suspended") AC.resume();
  var p = toLogical(e), id = hitAt(p);
  if (id) { doAction(id); return; }
  if (state === "play") { down[e.pointerId === undefined ? 0 : e.pointerId] = 1; hintT = Math.min(hintT, 40); pressStart(); }
}
function onUp(e) {
  delete down[e.pointerId === undefined ? 0 : e.pointerId];
  if (!anyDown()) pressEnd();
}
cv.addEventListener("pointerdown", function (e) { e.preventDefault(); onDown(e); }, { passive: false });
window.addEventListener("pointerup", onUp);
window.addEventListener("pointercancel", onUp);
window.addEventListener("blur", function () { down = {}; pressEnd(); });
document.addEventListener("visibilitychange", function () { if (document.hidden) { down = {}; pressEnd(); } });
window.addEventListener("keydown", function (e) {
  if (e.repeat) return;
  if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); audioInit(); if (state === "play") { down.kb = 1; pressStart(); } }
  if (e.code === "Escape" && state === "play") doAction("pause");
});
window.addEventListener("keyup", function (e) { if (e.code === "Space" || e.code === "ArrowUp") { delete down.kb; if (!anyDown()) pressEnd(); } });

/* ============================================================
   LOOP
   ============================================================ */
var last = 0, acc = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  var dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts;
  musicTick(dt);
  hits = [];
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.save();
  ctx.translate(offX, offY); ctx.scale(scale, scale);
  ctx.beginPath(); ctx.rect(0, 0, LW, LH); ctx.clip();

  if (state === "title") drawTitle();
  else {
    if (state === "play") { acc += dt; var n = 0; while (acc >= 1 / 60 && n < 8) { stepPlay(); acc -= 1 / 60; n++; }
      if (acc > 0.25) acc = 0; camUpdate(false); }
    else if (state === "won") { H.t++; camUpdate(false); }
    drawSky();
    ctx.save();
    ctx.translate(LW / 2, LH * 0.54); ctx.scale(cam.z, cam.z); ctx.translate(-LW / 2, -LH * 0.54);
    drawSkyline(L.far, 0.35, L.P.far, 0.55);
    drawSkyline(L.mid, 0.6, L.P.mid, 0.75);
    for (var i = 0; i < L.B.length; i++) drawBuilding(L.B[i]);
    drawStreet();
    for (var s = 0; s < L.stars.length; s++) drawStar(L.stars[s]);
    drawVictims();
    drawHero();
    drawRope();
    if (H.bubble > 0) {
      var bx = H.x - cam.x, by = H.y - cam.y;
      ctx.globalAlpha = 0.35; ctx.fillStyle = "#bfe9ff"; circ(bx, by, 36); ctx.fill();
      ctx.globalAlpha = 0.9; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3; circ(bx, by, 36); ctx.stroke(); ctx.globalAlpha = 1;
    }
    drawSpeed();
    drawFore();
    drawParts();
    ctx.restore();
    drawHUD();
    if (state === "paused") drawPause();
    if (state === "won") drawWon();
  }
  ctx.restore();
}
fit();
requestAnimationFrame(frame);
</script>
</body>
